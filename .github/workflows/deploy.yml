name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
      SITE_URL: ${{ vars.SITE_URL }}
      TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          package-manager-cache: true
      - run: python -m pip install --requirement requirements-dev.txt
      - run: npm ci
      - run: npm run build
      - run: python scripts/render_deploy_config.py
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: python scripts/scan_secrets.py
      - run: python scripts/scan_secrets.py --public
      - run: npm run check:worker -- --config .generated/wrangler.production.json
      - name: Apply additive D1 migrations
        run: node scripts/wrangler.mjs d1 migrations apply portfolio --remote --config .generated/wrangler.production.json
      - name: Deploy static assets and API Worker
        run: node scripts/wrangler.mjs deploy --config .generated/wrangler.production.json
      - name: Smoke test deployed site
        run: python scripts/smoke_test.py "$SITE_URL"
