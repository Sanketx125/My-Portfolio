<div class="palette" id="palette" hidden>
  <div class="palette__dialog" role="dialog" aria-modal="true" aria-label="Command palette">
    <div class="palette__field">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m16 16 4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <input class="palette__input" id="palette-input" type="text"
             placeholder="Search sections, projects, and actions…" autocomplete="off"
             spellcheck="false" role="combobox" aria-expanded="true"
             aria-controls="palette-list" aria-autocomplete="list" aria-label="Search commands">
      <span class="palette__kbd">ESC</span>
    </div>
    <ul class="palette__list" id="palette-list" role="listbox" aria-label="Commands"></ul>
    <div class="palette__empty" id="palette-empty" hidden>No matching commands</div>
  </div>
</div>
