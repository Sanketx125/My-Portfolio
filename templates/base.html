<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ content.name }} — {{ content.title }}</title>
<meta name="description" content="{{ content.tagline }}">
<meta name="author" content="{{ content.name }}">
<meta name="theme-color" content="#06080B" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F5F7F7" media="(prefers-color-scheme: light)">
<link rel="canonical" href="{{ request.url_root }}">

<!-- Open Graph -->
<meta property="og:type" content="website">
<meta property="og:title" content="{{ content.name }} — {{ content.title }}">
<meta property="og:description" content="{{ content.tagline }}">
<meta property="og:image" content="{{ url_for('static', filename=content.og_image, _external=True) }}">
<meta property="og:url" content="{{ request.url_root }}">

<!-- Twitter -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ content.name }} — {{ content.title }}">
<meta name="twitter:description" content="{{ content.tagline }}">
<meta name="twitter:image" content="{{ url_for('static', filename=content.og_image, _external=True) }}">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2306080B'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%232DD4BF' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='4' fill='none' stroke='%23F5A524' stroke-width='2'/%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/layout.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": {{ content.name | tojson }},
  "jobTitle": {{ content.title | tojson }},
  "description": {{ content.about | tojson }},
  "email": {{ content.email | tojson }},
  "address": {{ content.location | tojson }},
  "url": {{ request.url_root | tojson }},
  "sameAs": [
    {{ content.socials.github | tojson }},
    {{ content.socials.linkedin | tojson }}
  ]
}
</script>
</head>
<body>
<div class="progress" id="progress" aria-hidden="true"></div>

{% block content %}{% endblock %}

<div class="toast-stack" id="toast-stack" aria-live="polite" aria-atomic="true"></div>

{% include "partials/_palette.html" %}
{% include "partials/_chat.html" %}

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="{{ url_for('static', filename='js/animations.js') }}"></script>
<script src="{{ url_for('static', filename='js/map.js') }}"></script>
<script src="{{ url_for('static', filename='js/command-palette.js') }}"></script>
<script src="{{ url_for('static', filename='js/chat-widget.js') }}"></script>
<script src="{{ url_for('static', filename='js/contact-form.js') }}"></script>
</body>
</html>
